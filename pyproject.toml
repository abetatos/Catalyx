[project]
name = "catalyx"
version = "0.5.1"
description = "Macro catalyst → sector ETF movement platform"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.40",
    "rich>=13.7",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jsonschema>=4.22",   # schema validation in tests
    "pyarrow>=24.0.0",    # parquet lake (Tier 2)
    "pandas>=2.2",
    "numpy>=1.26",   # covariance.py (Ledoit-Wolf); arrives with pandas but imported directly
    "duckdb>=1.1",        # lake read-path (same SQL runs in DuckDB-WASM in the browser)
    "pytrends>=4.9.2",
]

# Dev tooling lives in a PEP-735 dependency-group (not an optional-extra): `uv sync` and
# `uv run` install groups automatically, so `uv run pytest` works from a fresh checkout.
# As an optional-extra it required `uv sync --extra dev`, which nobody ran — the suite was
# unrunnable ("No module named pytest") despite the CHANGELOG claiming green tests.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
catalyx = "catalyx.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalyx"]
