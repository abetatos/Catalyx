# CATALYX Sector Taxonomy — v2.0
# CANONICAL SOURCE: all sector_id values in the system must reference this file.
#
# Changelog:
#   v2.0 (2026-08-27) — PODA DEL UNIVERSO. investable pasa de 53 a 26 sectores.
#       Criterio unico y objetivo: un sector es investable SOLO si existe un ETF que el
#       usuario puede COMPRAR (UCITS en LSE/XETRA/Euronext/SIX, verificado contra yfinance).
#       Los 27 retirados no tenian vehiculo accesible — no podian ser objetivo de un
#       Movement, pero seguian consumiendo sector studies, momentum, flow y heatmap en
#       cada ciclo. Cada uno lleva `retired_2026_08_27: true` + `retired_reason`.
#       NADA se borra: son watch-only y se re-promocionan si aparece un ETF (ver
#       watch_triggers). Detalle del porque en la cabecera de etf_universe.yaml.
#   v1.2 (2026-06-04) — promoted semiconductors_memory from gap_20260604_semiconductors_memory.
# Rules:
#   - Never use free-text sector names in application code. Always use sector_id.
#   - investable: false → sector cannot be a Thesis target (watch-only mode)
#   - Quarterly review: ETF AUM < $200M → liquidity_warning: true
#   - Adding a sector: must also add ETF entries in etf_universe.yaml
#
# Schema for each entry:
#   id: str (snake_case, unique)
#   label: str
#   parent: str (parent sector group)
#   investable: bool
#   etf_proxy_quality: good | medium | poor | none
#   watch_only: bool (alias for !investable, kept explicit for clarity)
#   estimated_investable_from: YYYY (for watch_only sectors)
#   demand_drivers: list[str]
#   differentiation: str (why this ≠ adjacent sectors)
#   watch_triggers: list[str] (for watch_only sectors only)

