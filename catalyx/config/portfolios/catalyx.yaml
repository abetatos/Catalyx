portfolio_id: catalyx
name: Catalyx
strategy: catalyx
description: >
  The flagship all-things-considered book — CATALYX's own picks. Selects and weights by the
  full composite score (catalyst + momentum + flow + valuation − crowding). Balanced exposure
  to the system's best overall ideas, not a single-factor tilt.
benchmark_etf: SPY
construction:
  # v6 J1/L1: 10→6, 16→20, both from `book_shape.n_target`. v4's D-3 decided "12 wins" and was
  # never shipped — the wrong direction: unifying DOWN forces 8 positions and 8 of the 10 free
  # monthly trades. The model book must be executable under the real book's rules or its
  # execution alpha partly measures a ceiling no disciplined executor could reach.
  max_positions: 6
  # v6 H3: the floor is now in composite z-units — 0.0 = the run's universe average. NOT the
  # mechanical translation of the old 55 (= +0.33): that leaves 8 candidates for 6 slots, a
  # margin thin enough that the floor starts co-selecting with top-N. Its job is to exclude
  # below-average names; the selector is top-N under the caps. Measured 2026-08-31: 0.0 and
  # +0.33 pick the SAME six — the momentum/crowding filters bind first either way.
  min_composite_z: 0.0
  min_composite: 55        # pre-v6, read one major more for unmigrated profiles
  min_momentum: 40
  max_crowding: 85
  exclude_narrative_maturity: [exhausted]

  # ── CONVICTION GATE (v10 P1) — the ABSOLUTE standard, beside the relative floor ──
  # `min_composite_z` is relative by construction: 0.0 means "better than this run's average",
  # so in a universe where every driver is fading it still admits half the field and the book
  # stays full because the book is always full. The user's criterion is the other question —
  # "if a sector stops being interesting under its catalysts, it should not be in the book" —
  # and a z-score cannot express it: it ranks, it does not judge whether the thing ranked is
  # worth owning. So the gate reads catalyst_alignment, which is an absolute level in [0,100]
  # and already the composite's largest weight (0.35).
  #
  # 40 IS READ OFF THE MEASURED DISTRIBUTION, NOT CHOSEN. On run_20260831_184616 the 26 CA
  # values are bimodal: twenty between 71.5 and 96.2, then a 25-point gap, then 36.2 / 13.9 /
  # 13.9 / 0.0 — precisely the sectors carrying no live structural driver. 40 sits in the gap.
  # It changes nothing about today's book (all four excluded rank 17th or worse), and that is
  # the point: it states the criterion without silently re-cutting a table already decided on.
  # What it stops is the case that has not happened yet — eu_retail_banking, momentum 86.5 and
  # CA 13.9, one good quarter from `buy_if`'s rank-8 ceiling, bought on price with no driver.
  #
  # An IMPUTED CA (`ca_imputed`, v6 H2 — no study, so CA took the universe prior) is NOT judged:
  # it passes and is reported unevaluated. Turning "not measured" into "fails" is the single
  # inference v5 and v6 spent two versions removing. A MEASURED zero IS judged — infrastructure
  # _core scores 0.0 with a study behind it, and that zero was observed.
  entry_gate:
    enabled: true
    min_catalyst_alignment: 40
  weighting: composite
  max_position_pct: 20
  # Conviction sizing (overrides global portfolio_weighting): the flagship book expresses the
  # ranking in the WEIGHTS, not just the selection. softmax over z-normalized composite spreads
  # the narrow score band (≈65–74) into dispersed weights; the deadband caps tax-churn.
  weighting_transform: softmax
  sharpness: 0.25
  rebalance_deadband_pct: 1.0
