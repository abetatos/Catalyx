portfolio_id: momentum
name: Momentum
strategy: momentum
description: >
  Rides the trend. Selects and weights by cross-sectional momentum, not composite —
  so it concentrates in whatever is moving hardest right now. Highest dispersion of the
  four strategies. Matches the investor's momentum tilt.
benchmark_etf: SPY
construction:
  max_positions: 10
  min_composite_z: -0.33    # v6 H3: floor in z-units, 0.0 = the run's universe average
  min_composite: 45        # pre-v6, read one major more
  min_momentum: 55
  max_crowding: 100
  exclude_narrative_maturity: [exhausted]
  weighting: momentum
  max_position_pct: 18
