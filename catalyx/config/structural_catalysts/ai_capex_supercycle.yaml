onset_evidence: "Microsoft $10B OpenAI investment announced Jan 2023. Google Bard launch. Hyperscaler capex guidance inflections
  in Q1 2023 earnings."

catalyst_type: technology_adoption
catalyst_subtype: ai_inference_buildout
geography: [US, EU, APAC, GLOBAL]
thematic_tags: [ai, data_center, semiconductors, power, infrastructure, capex]

user_rank: 2
user_notes: "Most visible structural catalyst in the market. Risk of being priced in for semiconductors — focus on power,
  cooling, networking as higher-alpha adjacent plays."

