deactivation_conditions:
- id: deact_01
  condition: >
    A major fiat-backed stablecoin de-pegs or an issuer-reserve failure triggers a >20% contraction in
    aggregate stablecoin supply sustained for two consecutive months (settlement-trust break).
  action: review_required
- id: deact_02
  condition: >
    Regulatory reversal (GENIUS Act repeal or a restrictive rewrite) that pushes settlement off regulated
    networks, AND incumbent on-chain settlement run-rate falls for two consecutive quarters.
  action: full_deactivation
- id: deact_03
  condition: >
    Annual stablecoin settlement volume falls below $3T for two consecutive quarters (reverts to a
    trading-collateral instrument rather than a payment rail).
  action: downgrade_to_weak

