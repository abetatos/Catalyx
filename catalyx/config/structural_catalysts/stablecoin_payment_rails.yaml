# StructuralCatalyst: Stablecoin Payment-Rail Adoption (GENIUS Act era)
#
# Calibration anchor (Rule 3): bootstrap 64 — on par with struct_solar_lcoe_deployment (64.1), a notch
# below struct_enterprise_cyber_spend_supercycle. Onset-phase secular trend, high novelty; the
# incumbent-capture thesis (Visa/Mastercard absorbing rather than being disrupted) limits downside.
#
# Drives fintech_payments. NOTE this is a DIFFERENT thesis from crypto_infrastructure: stablecoin rails
# are a payments-settlement infrastructure trend where the incumbents win, not a BTC-price/regulation bet.

id: struct_stablecoin_payment_rails
type: structural
schema_version: "1.4"
title: "Stablecoin payment-rail adoption — regulated settlement infrastructure, incumbent-captured"
description: >
  Fiat-backed stablecoins are becoming a mainstream settlement rail rather than a crypto-trading instrument,
  and the payments incumbents are absorbing the technology rather than being disrupted by it. Three forces make
  it structural: (1) Regulatory clarity — the US GENIUS Act established a federal framework for payment
  stablecoins, converting a legal-grey instrument into regulated, bank-adjacent settlement money. (2) Incumbent
  capture — on 2026-06-30 a consortium including Visa, Mastercard and Coinbase launched a joint stablecoin
  standard ("Open USD" / "Open Standard," 140+ businesses); Mastercard acquired BVNK for up to $1.8B (Mar 2026);
  Visa's on-chain settlement pilot reached a ~$7B annualized run-rate (+50% QoQ) across nine blockchains. The
  networks are building the rails, so stablecoin volume growth accrues to them rather than eroding their take.
  (3) Scale — fiat-backed stablecoin supply exceeds $270B (~40x vs 2020) and annual settlement volume (~$10.9T
  adjusted, 2025) is approaching Visa's ($14.2T). Primary sector: fintech_payments (Visa, Mastercard, and the
  on-chain settlement enablers). Key risk: a stablecoin de-peg / issuer-reserve event, or a regulatory reversal
  that pushes settlement off-network, would break the incumbent-capture thesis.

created_at: "2026-07-01T12:00:00Z"
created_by: user
onset_period: "2025-Q3"
onset_evidence: >
  US GENIUS Act enactment (2025) established the federal payment-stablecoin regime; incumbent commitment
  followed within months (Visa on-chain settlement scaling, Mastercard-BVNK acquisition Mar 2026, and the
  Visa/Mastercard/Coinbase consortium launch 2026-06-30) — the regulatory floor plus incumbent adoption mark
  the onset of a durable settlement-infrastructure trend, distinct from the speculative 2021 stablecoin surge.

catalyst_type: technology_adoption
catalyst_subtype: stablecoin_payment_rail_adoption
geography: [US, GLOBAL]
thematic_tags: [stablecoin, payments, genius_act, visa, mastercard, settlement, fintech, on_chain]
user_rank: 4
user_notes: >
  Cleanest UCITS expression is broad payments/fintech (Visa/Mastercard-heavy baskets). The incumbent-capture
  framing is the key differentiator — this is NOT a bet on stablecoin issuers (Circle) disrupting the networks,
  but on the networks monetizing the rails. Bootstrap 64 anchored to struct_solar_lcoe_deployment (64.1).

