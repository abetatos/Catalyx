# StructuralCatalyst: BIOSECURE Act Biomanufacturing Reshoring
#
# Calibration anchor (Rule 3): bootstrap 58 — weaker than struct_enterprise_cyber_spend_supercycle (86);
# real structural demand pull (CHIPS-Act-style reshoring) but slow revenue translation and a poor ETF proxy.
# Drives synthetic_biology (primary).

id: struct_biosecure_biomanufacturing_reshoring
type: structural
schema_version: "1.4"
title: "BIOSECURE Act biomanufacturing reshoring — policy-driven pull toward Western DNA/bio supply"
description: >
  A CHIPS-Act-style reshoring of the biomanufacturing and genomics supply chain, driven by US national-security
  policy: (1) Policy — the BIOSECURE Act was signed into law (Dec 2025, within the FY2026 NDAA), naming Chinese
  providers (WuXi AppTec/Biologics, BGI/MGI/Complete Genomics) and pushing US biotech + federal contractors to
  designated-supplier alternatives; enforcement phases in through 2027. (2) Beneficiaries — Western DNA-synthesis
  and tools names (Twist Bioscience, Agilent) inherit displaced demand; Twist posted Q2 FY2026 revenue ~$110.7M
  (+19%) with an EBITDA-breakeven target. (3) Cost curve — DNA synthesis cost continues to fall (~$0.07-0.10/bp),
  and AI-designed biology (cell-free protein programs) compounds the demand pull. Primary sector: synthetic_biology.
  Adjacency to genomics_precision_medicine (BGI/MGI/Complete Genomics are named sequencing providers). Key risk:
  slow commercial translation (survivor names still sub-scale) and a poor UCITS ETF proxy dilute the tradable signal.

