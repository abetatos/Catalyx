  El reshoring de biomanufactura (BIOSECURE Act) es el brazo regulatorio/de cadena de suministro de la misma maduracion de plataforma biotech. Su sector objetivo (synthetic_biology) quedo watch-only en el universo v2.0 por falta de vehiculo.
