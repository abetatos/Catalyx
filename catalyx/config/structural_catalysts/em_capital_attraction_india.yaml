user_rank: 6
user_notes: >
  EUR-based investor carries a double-FX drag (INR/USD + USD/EUR). Bootstrap 45 — deliberately below all other
  structurals: the long-run consumption thesis is intact but the near-term driver is two-sided and USD-gated.
  Watch DXY < 97 and FPI flows turning net-positive as the re-rating triggers. The consumer_india_em study is
  stale on its old weak-dollar premise and should be refreshed via /catalyx-sector-study.

