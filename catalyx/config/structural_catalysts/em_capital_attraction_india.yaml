# StructuralCatalyst: EM Capital-Attraction Cycle & Policy-Driven Reflows (India)
#
# Calibration anchor (Rule 3): bootstrap 45 — weaker than every other active structural. A real long-run
# EM-consumption floor, but the near-term driver is two-sided and USD-gated: the 2026 thesis flipped from
# "RBI easing + weak dollar" to "policy-driven foreign-capital re-attraction against a strong-dollar headwind".
# Designed to score LOW/degrading now — the sector was uncatalyzed precisely because its driver is contested.
# Drives consumer_india_em.

id: struct_em_capital_attraction_india
type: structural
schema_version: "1.4"
title: "EM capital-attraction cycle & policy-driven reflows (India) — USD-gated"
description: >
  India's equity/consumption thesis has shifted from a monetary-easing + weak-dollar tailwind to a
  POLICY-DRIVEN foreign-capital re-attraction story, whose near-term intensity is gated by the US-dollar cycle.
  Three moving parts: (1) Policy pull — after FPIs net-sold ~$19B of Indian equity/debt, the RBI + government
  launched a coordinated capital-attraction package (expanded FAR access to government securities, FCNR(B)
  facilities, removal of certain CGT/withholding taxes on foreign bond investment); the rupee posted its biggest
  1-day gain in two months toward ~sub-₹95/USD. (2) Monetary — the RBI HELD the repo at 5.25% (June 2026, no cut),
  cut its growth forecast and raised inflation (crude/geopolitics), so the easing leg the old thesis relied on has
  stalled. (3) FX gate — DXY rebounded to ~101 by mid-2026 on the Fed hawkish pivot (2026 cuts erased), a direct
  headwind to EM flows; a EUR-based investor also carries the INR/USD × USD/EUR double-FX drag. Primary sector:
  consumer_india_em. This is a WEAK / contested structural by design — the long-run EM-consumption floor is intact,
  but the cyclical + FX overlay is currently a drag, so it should rank low until the USD cycle turns.

created_at: "2026-07-01T12:00:00Z"
created_by: user
onset_period: "2026-Q2"
onset_evidence: >
  The June-2026 RBI/government coordinated capital-attraction measures (FAR expansion, FCNR(B) facilities,
  foreign-bond tax relief) marked the pivot from an easing/weak-dollar thesis to a policy-reflow thesis, after
  ~$19B of cumulative FPI outflows and a DXY rebound to ~101.

