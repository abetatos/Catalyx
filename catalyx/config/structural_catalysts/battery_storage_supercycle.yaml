# StructuralCatalyst: Battery-Metals & Stationary-Storage (BESS) Supercycle
#
# Calibration anchor (Rule 3): bootstrap 57 — WEAKER than struct_solar_lcoe_deployment (64.1) and well
# below struct_ai_capex_supercycle (89.9). The oversupply→deficit inflection is real, but the CATL/LFP
# capacity overhang and pack-price deflation cap intensity in the low-mainstream / high-emerging band.
#
# Scope note vs struct_energy_transition_grid: that catalyst measures GRID BOTTLENECK severity
# (transmission, transformer lead times, interconnection) — it deliberately does NOT cover battery
# chemistry or metals. This catalyst covers the demand+supply of the BATTERY itself: lithium/nickel
# price inflection, BESS installations as a new structural demand leg, and EV run-rate. Zero indicator
# overlap; the two are compounding but distinct. Drives lithium_miners (primary) and the battery-grade
# nickel leg of cobalt_nickel (cobalt's acute driver is the separate DRC-quota event).

id: struct_battery_storage_supercycle
type: structural
schema_version: "1.4"
title: "Battery-metals & stationary-storage (BESS) supercycle — oversupply→deficit inflection + new demand leg"
description: >
  Battery raw materials and stationary storage are inflecting from a 2023-2024 oversupply glut back toward
  balance, on the back of a genuinely new structural demand leg. Two forces: (1) Price inflection — lithium
  carbonate recovered from the ~$8,300/t June-2025 trough to ~$25,000/t by mid-2026 as the market flips from
  surplus to a modest deficit (Fastmarkets), a supply-discipline signal after two years of Chinese lepidolite
  and brine overcapacity. (2) Demand broadening — battery demand is no longer EV-only: grid-scale BESS is now
  ~30% of lithium demand (heading to ~36% by 2030), with China's NEA targeting ~180 GW installed BESS by 2027
  and global installations rising from ~421 GWh (2025) toward ~600 GWh (2026E). BESS is a policy-independent,
  AI/renewables-driven demand floor (datacenter backup + solar firming + grid arbitrage) that did not exist at
  scale in the prior lithium cycle. Primary sector: lithium_miners. Secondary: the battery-grade nickel/MHP leg
  of cobalt_nickel. Key near-term risk: CATL and Chinese cell-makers' capacity surge + LFP pack-price deflation
  (BNEF pack prices ~$108/kWh) can re-open the supply overhang and cap metal prices — hence the mid-band intensity.

created_at: "2026-07-01T12:00:00Z"
created_by: user
onset_period: "2025-Q3"
onset_evidence: >
  Lithium carbonate bottomed near $8,300/t in June 2025 and rose >50% into late 2025, coinciding with the
  first quarter that grid-scale BESS surpassed ~25% of global lithium demand (S&P Global). The simultaneous
  price bottom and BESS-demand crossover mark the inflection out of the 2023-2024 oversupply regime.

catalyst_type: climate_transition
catalyst_subtype: battery_storage_bess_supercycle
geography: [CHN, US, GLOBAL]
thematic_tags: [lithium, nickel, bess, battery_storage, ev, energy_storage, battery_metals]
user_rank: 5
user_notes: >
  Primary UCITS vehicles: broad battery/energy-storage baskets (e.g. VOLT/BATT-style) and lithium miners
  (LIT). The sector is bifurcated — miners (price-leveraged) vs cell-makers (margin-compressed by LFP
  deflation). Bootstrap 57 anchored below struct_solar_lcoe_deployment (64.1). CATL supply overhang is the
  key cap on intensity. Run intensity_engine after the first indicator refresh to replace bootstrap.

