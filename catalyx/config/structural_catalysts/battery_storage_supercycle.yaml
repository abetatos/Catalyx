deactivation_conditions:
- id: deact_01
  condition: >
    Lithium carbonate falls back below $12,000/t for two consecutive quarters (would signal the oversupply
    glut has re-opened and the deficit inflection failed).
  action: downgrade_to_weak
- id: deact_02
  condition: >
    Global BESS annual installations fall below 200 GWh AND BESS share of lithium demand falls below 15% for
    two consecutive quarters (the new structural demand leg has collapsed back to an EV-only cycle).
  action: full_deactivation
- id: deact_03
  condition: >
    A confirmed multi-hundred-GWh Chinese cell-capacity surge drives battery pack prices below $80/kWh with
    metal prices following (structural margin destruction across the chain).
  action: review_required

