  China is the dominant idiosyncratic driver — the study's history shows it outweighs rates+recession combined.
  Bootstrap 67 anchored near struct_solar_lcoe_deployment (64.1): sector-defining and inflecting up, but early
  in confirmation and capped by tariff margin drag + EUR strength. Run intensity_engine after first refresh.

