id: struct_china_luxury_recovery
type: structural
schema_version: "1.4"
title: "China luxury-demand recovery — mainland consumption reset off the 2024-2025 trough"
description: >
  Chinese personal-luxury demand — the single largest swing factor for the global luxury complex — is
  inflecting up from a two-year contraction. The mechanism is a consumption reset, not a policy pump: (1) Trough
  confirmed — Bain data show mainland personal luxury contracted only ~3-5% in 2025 (vs ~18-20% in 2024) and is
  forecast to return to low-to-mid single-digit growth (~+5%) in 2026; Q3-2025 was the trough. (2) Company
  confirmation — LVMH posted its first sales growth in over a year (+1%, citing a "noticeable improvement" in
  Asia-ex-Japan led by China); Richemont's APAC grew ~10% at constant FX with China back to growth for the first
  time in ~2 years; Burberry China comps turned positive. (3) Capital commitment — LVMH is investing into the
  recovery (opened the 1,600m² "The Louis" Shanghai flagship June 2026; multiple Beijing multi-storey stores).
  A gradually appreciating CNY narrows the mainland-vs-overseas price gap, repatriating demand onshore. Primary
  sector: luxury_goods (LVMH, Richemont, Hermès, Kering, Burberry). Key near-term caps: US/EU import tariffs
  compress margins (~-150bps on LVMH Fashion & Leather) and a strong EUR is a translation headwind — so the
  recovery is real but its intensity is bounded until the +5% mainland-growth confirmation is sustained.

created_at: "2026-07-01T12:00:00Z"
created_by: user
onset_period: "2025-Q4"
onset_evidence: >
  Bain's H2-2025 luxury report identified Q3-2025 as the mainland-China demand trough (contraction narrowing
  to ~-3/-5% from ~-18/-20% in 2024), and LVMH's Q4-2025 print showed the first group sales growth in over a
  year led by an Asia-ex-Japan / China improvement — the data-confirmed inflection off the trough.

