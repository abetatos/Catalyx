    not a grid-capex cut: US cancellations of solar/wind/storage capacity (more than 8 GW in Q1 2026, more than 21 GW since
    the start of 2025) and DOE grant terminations; the thesis's grid leg is not touched. Rates at 5.1-5.2% on the 10y (2026-10-13)
    are a valuation headwind for utilities, not a capex cut."
  source: Rystad Energy via pv magazine (2026-06-06); Wood Mackenzie transformer survey Q2 2025; Foley & Lardner 'The 
    grid's bottleneck isn't just money, it's materials' (2026-09); Renewable Energy World / Carbon Pulse on 
    cancellations
