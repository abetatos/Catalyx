- date: '2026-10-06'
  verdict: intact
  evidence: 'Demand is intact and the bottleneck persists: global grid capex set to surpass $650B in 2026 (Rystad, +5% YoY,
    more than double 2020); large power transformers (>=100 MVA) now 48-72 month lead time vs 12-18 in 2019 with indicative
    prices +70-100%; typical EU/North American manufacturer lead times 2-3 years; switchgear reported sold out through 2028;
    US investor-owned utilities plan $1.4T capex through 2030 ($686B T&D). Over 2,500 GW of solar/wind/storage is stalled
    in interconnection queues. Copper spot ind_03 already re-recorded today at 14,643 USD/t (LME record 14,875 on 2026-09-10;
    14,014 on 2026-09-22; ~-6% off record). ind_01 stays at 26 months (EU second-tier range 20-28 recorded 2026-09-01, no
    new survey) and ind_02 (EU grid investment, stored 96, last 2026-03-01) has no fresh print: sources give EC need of EUR
    65-100B per year to 2030, within the stored range.'
  source: Rystad Energy via pv magazine USA (grid capex 2026); GridReadiness HV transformer lead times 2026; Deluair 
    2026 grid capex supercycle; Bruegel / ENTSO-E investment needs; Bloomberg 2026-10-01 copper
- date: '2026-09-14'
  verdict: weakening
  evidence: "Financing-cost headwind confirmed, not just theorized: Fitch downgraded the US utilities sector outlook to 'deteriorating',
    citing $240B of 2026 capex clashing with high interest rates and regulatory lag on cost recovery; high rates are explicitly
    named as raising the cost of debt financing for a sector planning $1.3-1.4T of 2026-30 capex. This does not reverse the
    buildout thesis (capex guidance is still RISING, not falling) but it raises the effective cost of capital for the position
    we hold via IQQH.DE -- consistent with the 'adverse' sector_impact just filed on cat_20260910_ecb_rate_hike for this sector.
    No dedicated financing-cost indicator exists on this catalyst yet; flagged for a future indicator addition rather than
    forcing a number onto ind_01-03, which measure lead times / EU investment / copper, not cost of capital."
  source: Fitch utilities sector outlook 2026-09 via MarketScale; S&P Global utility capex forecast 2026-04, accessed 
    2026-09-14
- date: '2026-09-01'
  verdict: strengthening
