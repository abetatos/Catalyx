review_log:
- date: '2026-08-31'
  verdict: weakening
  evidence: The Trump administration struck agreements with Eli Lilly and Novo Nordisk to offer Most-Favored-Nation 
    pricing on semaglutide (Ozempic/Wegovy) and tirzepatide (Mounjaro/Zepbound) - the two molecules the entire thesis 
    rests on. MFN compresses US realised price, which is the revenue lever of a revenue supercycle; the offsetting 
    Medicare-access volume leg is real but slower and lower-margin. No 2026 sales figures surfaced to size the net 
    effect, so this is a mechanism-level weakening, not a measured one. Consistent with the v5.2 decision to decline 
    GLP-1 as a pharma driver in writing.
  source: AMCP federal update on the MFN GLP-1 deal; Conference Board CED analysis
