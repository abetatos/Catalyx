deactivation_conditions:
- id: deact_01
  condition: >
    US GLP-1 weekly prescription volume falls below 4M/week for two consecutive quarters (would indicate
    demand saturation or a safety/efficacy setback reversing adoption).
  action: downgrade_to_weak
- id: deact_02
  condition: >
    A major GLP-1 safety signal (regulatory black-box or withdrawal) removes a lead molecule, OR Medicare
    obesity coverage is rescinded before onset — collapsing the reimbursed-lives thesis.
  action: full_deactivation
- id: deact_03
  condition: >
    Consensus obesity-drug TAM projection falls below $80B for two consecutive quarterly analyst updates
    (structural demand narrative de-rating).
  action: review_required

