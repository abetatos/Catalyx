# StructuralCatalyst: GLP-1 / Obesity-Drug Supercycle
#
# Calibration anchor (Rule 3): bootstrap 82 — on par with struct_cb_gold_accumulation (84),
# slightly below struct_ai_capex_supercycle (89.9). Mainstream, consensus, but the TAM is still
# expanding (oral GLP-1 approval + Medicare coverage onset 2026) so it is not yet exhausted.
#
# Sign note: this catalyst is a TAILWIND for pharma_large_cap and longevity_biotech, but a
# HEADWIND (procedure displacement) for medical_devices — bariatric/cardio-metabolic device volumes
# fall as GLP-1 use rises. medical_devices is therefore deliberately NOT linked in active_catalyst_ids:
# the catalyst_scorer treats a linked structural as a POSITIVE alignment contributor, which would
# misrepresent a sector the trend actually pressures. Model the device headwind separately if desired.

id: struct_glp1_obesity_supercycle
type: structural
schema_version: "1.4"
title: "GLP-1 / obesity-drug supercycle — cardio-metabolic TAM expansion + oral + Medicare onset"
description: >
  The GLP-1 receptor-agonist class (semaglutide, tirzepatide, and the 2026 oral entrants) has moved
  from a diabetes therapy to a structural cardio-metabolic platform with a multi-hundred-billion-dollar
  addressable market. Three compounding forces make it structural rather than episodic: (1) Indication
  expansion — beyond weight loss into cardiovascular risk reduction, sleep apnea, MASH/liver, and CKD,
  each adding reimbursed lives. (2) Oral formulation — the FDA approval of Eli Lilly's oral orforglipron
  (Foundayo) on 2026-04-01 removes the injection barrier and the cold-chain constraint, opening primary-care
  and ex-US scale; the pill is projected to take the majority of the oral-obesity market by 2030. (3) Payer
  onset — US Medicare obesity coverage begins ~July 2026, converting a cash-pay market into a reimbursed one.
  ~39 GLP-1 molecules from ~34 companies are in development, so the class is deepening, not saturating.
  Primary beneficiary: pharma_large_cap (Novo Nordisk, Eli Lilly and the fast-followers). Adjacent tailwind:
  longevity_biotech (metabolic-healthspan framing is the mainstream, investable expression of the aging thesis).
  Adjacent HEADWIND: medical_devices (bariatric surgery volumes fell ~34% 2022-2024 as GLP-1 use rose ~140%).
  Key near-term risk: US Section 232 pharma tariffs (100% on patented imports, effective 2026-07-31) compress
  ex-US manufacturer margins — a discrete policy headwind tracked as a separate event, not part of this structural.

created_at: "2026-07-01T12:00:00Z"
created_by: user
onset_period: "2023-Q1"
onset_evidence: >
  Novo Nordisk's Wegovy SELECT trial (topline Aug 2023) demonstrated a 20% reduction in major adverse
  cardiovascular events, reframing obesity drugs as cardio-metabolic therapeutics; simultaneous 2023
  supply shortages of Wegovy/Mounjaro confirmed demand vastly exceeded capacity. Both the clinical
  re-rating and the demand-supply gap established the supercycle in Q1-Q3 2023.

catalyst_type: technology_adoption
catalyst_subtype: glp1_obesity_drug_adoption
geography: [US, EU, GLOBAL]
thematic_tags: [glp1, obesity, semaglutide, tirzepatide, orforglipron, pharma, cardio_metabolic, medicare]
user_rank: 3
user_notes: >
  Cleanest UCITS expression is broad pharma (e.g. HEAL/IHCU or single-names Novo/Lilly where accessible);
  there is no pure-play GLP-1 UCITS ETF, so the sector vehicle dilutes the signal. Bootstrap 82 anchored to
  struct_cb_gold_accumulation (84). Run intensity_engine after the first indicator refresh to replace bootstrap.

