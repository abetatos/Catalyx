review_log:
- date: '2026-10-21'
  verdict: intact
  evidence: "No change since the 2026-10-19 verdict. Fresh, dated and supportive but US-side: Northrop Grumman Q3 (2026-10-20)
    raised 2026 segment operating income guidance to USD 4,940-5,040M and EPS to USD 29.35-29.75; NOC +4.5% and RTX +0.7%
    on 2026-10-20. Germany's 2026 core defence budget about EUR 83B with defence exempt from the debt brake and a 3.7%-of-GDP
    target from 2030 (May 2026 update). The Rheinmetall F126 / guidance-cut crack recorded on 2026-10-19 stands and nothing
    new reverses or deepens it; no dated October 2026 European procurement order or budget decision was retrievable (searches
    returned April 2026 and 2025 items). Ukraine-side: Zelensky dropped an energy-sites ceasefire Trump had announced (about
    2026-10-17), so no peace-driven demand shock. ind_02 still carries the Rheinmetall backlog caveat from 2026-10-19."
  source: Northrop Grumman Q3 2026 8-K (sec.gov) 2026-10-20; Yahoo Finance / Investopedia markets 2026-10-20; MercoPress
    2026-10-17; Reuters on Germany 2026 defence budget
- date: '2026-10-19'
  verdict: intact
  evidence: "Downgraded from the 2026-10-17 'strengthening' to intact because the short-case search found a corroborated,
    dated company-level crack the previous scan missed: on 2026-08-06 Rheinmetall cut FY2026 sales guidance to EUR 13.7-14.2B
    (from 14.0-14.5B, about -EUR 300M) after the German government cancelled the delayed F126 frigate programme, cut its year-end
    order-backlog target to above EUR 100B from about EUR 135B, and cut its capex target to 8-9% of sales from 16%; H1 operating
    cash flow was about -EUR 1.6B. Four independent outlets agree (Defense News 2026-08-06, Baird Maritime, defence-industry.eu,
    maritime-professionals). It is a programme cancellation inside one prime, not a budget reversal: H1 sales were still +39%
    with backlog EUR 80.5B (+44%), the alliance core average is 2.86% of GDP, Germany's 2026 defence budget is about EUR 83B,
    and the 5%-by-2035 Hague commitment is untouched. Not scored as an event (strength 40 by rubric, see triage). Flag for
    the review: ind_02 (combined order-book growth) relies on Rheinmetall's backlog, whose forward path was just guided down
    by about a quarter. The October German procurement orders the search returned (Skyranger, Eurofighter, Schakal) could
    not be dated to 2026 (the Eurofighter/Skyranger items match the 2025 Bundestag approvals) and were NOT used."
  source: Defense News 'Rheinmetall scales down 2026 sales outlook on scrapped frigate program' (2026-08-06); Baird 
    Maritime; defence-industry.eu; Rheinmetall H1 2026 press release (2026-08-06)
- date: '2026-10-17'
  verdict: strengthening
  evidence: 'NATO 2026 defence-expenditure estimates (reported 2026-07-07, Anadolu/Reuters): alliance combined defence spending
    >USD 1.8T in 2026 (+~11% vs ~1.63T in 2025); NATO-wide average core defence spending 2.86% of GDP, European allies + Canada
    2.53% core (3.93% incl. related); five allies (Lithuania, Estonia, Latvia, Poland, Greece) above 3.5% core. Industry confirmation:
    Rheinmetall Q2 2026 (2026-08-06) backlog ~EUR 80-80.5B (vs EUR 63B at 2025-06-30, press summaries quote +44%, unreconciled),
    Leonardo H1 2026 (2026-07-30) backlog ~EUR 59B (+30% vs EUR 45B at 2025-06-30, includes ~EUR 6B from consolidated Iveco
    Defence Vehicles) with EUR 16.3B new orders (+44.6%), Airbus Defence and Space H1 2026 order intake EUR 9.3B vs EUR 5.1B.
    ind_02 (combined order-book growth) NOT recorded: Airbus D&S backlog not found and the Rheinmetall growth rate is inconsistent
    across sources, so the three-company combined figure cannot be computed. ind_03 (EU defence ETF monthly AUM change) not
    recorded: only a level snapshot is observable (EUDF.L totalAssets USD 4.37B on 2026-10-17), not a monthly change. [ind_01
    NOT recorded in the review: 2.86 is an alliance-wide aggregate, the stored 2.34 is the average per member — different
    statistic]'
  source: NATO 2026 defence expenditure estimates via Anadolu (2026-07-07) and Reuters/Internazionale (2026-07-07); 
    Rheinmetall Q2 2026; Leonardo H1 2026 press release 2026-07-30; Airbus H1 2026 press release
- date: '2026-10-17'
  verdict: intact
  evidence: NATO reports European allies and Canada raising defence spending ~11% to USD 634B in 2026 (2.53% of GDP 
    core, 3.93% with related spend); USD 50B+ in procurements secured at the Ankara summit defence-industry forum and a 
    USD 40B five-year drone initiative; ICDS 2026-09-14 tracks national plans to the 3.5% + 1.5% by 2035 target. No 
    numeric indicator recorded.
  source: Brussels Times and Qatar Tribune NATO reports; ICDS 2026-09-14; HANetf Future of Defence July 2026
- date: '2026-10-06'
  verdict: intact
  evidence: 'Rheinmetall H1 2026 (2026-08-06): Q2 sales EUR 3.289B +69% YoY, operating result +115%, backlog above EUR 80B
    (+44% YoY, 70% fixed), Q2 order intake EUR 11.4B (+476%, book-to-bill above 3.0x), backlog guided to EUR 100-120B by end-2026;
    shares nonetheless fell 5.7% on cash-flow concerns. NATO European allies on track for ~2.3% of GDP in 2026 (IISS), with
    European NATO plus Canada at ~2.53% (~$634B); the 3.5% core / 5% total 2035 target stands. EU states agreed on 2026-09-25
    to release EUR 6.6B of stalled European Peace Facility aid for Ukraine. No numeric indicator recorded: ind_02 is a three-company
    combined order-book growth and only Rheinmetall (+44%) was found; ind_01 (stored 2.34) vs 2.3-2.53 is within 10%; no flow
    data for ind_03 (only AUM levels: WisdomTree EUR 4,335M, iShares EUR 348.8M at 2026-09-29).'
  source: "Rheinmetall H1 2026 financial report / Q2 2026 call (investing.com, quartr); IISS 'NATO defence spending: navigating
    the noise' (2026-07); Euronews 2026-09-25"
- date: '2026-09-14'
  verdict: intact
  evidence: No budget cut or procurement shortfall found at the alliance level. Germany's defense spend rose 18% in real
    terms in 2025 with 2026 funding projected at EUR117.2B; the 5%-of-GDP target (3.5% core + 1.5% related) remains the 
    stated NATO trajectory. Equipment INVENTORY is still below 2021 levels despite the spending increase (demand still 
    outrunning supply, not a budget reversal), and a handful of members (Czechia, and financing constraints in 
    France/Italy/UK) face pressure -- none of it a reversal of the aggregate trend this catalyst tracks.
  source: ICDS Defence Spending Who Is Doing What July 2026; McKinsey Feb 2026 defence dashboard, accessed 2026-09-14
- date: '2026-08-31'
  verdict: strengthening
  evidence: Rheinmetall order backlog at record EUR 80.4bn in early Aug 2026 (was EUR 73bn in May), new nominations 
    +476% YoY to EUR 11.37bn; F-35, ammunition and missile capacity expansions due through 2027; FY2026 sales growth 
    guided up to +45%. Combined 3-company revenue growth print not yet available for ind_02 - RHM-only, so no numeric 
    written.
  source: defence-industry.eu 2026-08 (EUR 80.4bn backlog); miningmetalnews 2026-05-26 (EUR 73bn); CNBC 2026-03-11 (FY26
    guidance)
