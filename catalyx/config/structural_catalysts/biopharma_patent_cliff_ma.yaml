id: struct_biopharma_patent_cliff_ma
type: structural
schema_version: "1.4"
title: "Biopharma patent-cliff M&A supercycle — LOE-driven takeout wave into clinical-stage biotech"
description: >
  A multi-year loss-of-exclusivity (LOE) wall is forcing large-cap pharma to replace ~$230-300B of branded
  revenue exposed to patent expiry by 2030, and the fastest fix is acquisition. This is structural, not a
  one-off deal cycle: (1) The cliff is dated and large — Keytruda, Eliquis, Opdivo and others lose exclusivity
  2026-2028, so acquirers have a hard, recurring pipeline-replacement need. (2) Deal flow confirms it —
  biopharma M&A reached ~$106B across ~201 transactions by early June 2026 (avg deal ~$527M vs ~$365M in 2025);
  IQVIA forecasts ~$140-160B full-year. Eli Lilly alone spent ~$25B across 10 acquisitions; Merck is evaluating
  Revolution Medicines at ~$28-32B. (3) The takeout premium is durable — clinical-stage targets command 45-65%
  premiums, and the XBI is +~50% trailing 12 months, largely on the M&A bid. Primary sector: biotech_drug_development
  (the clinical-stage names that get bought). Secondary read-through to genomics and synthetic_biology (platform
  targets). Key risk: FTC/antitrust tightening or a rate-driven financing freeze slows the deal machine.

created_at: "2026-07-01T12:00:00Z"
created_by: user
onset_period: "2024-Q4"
onset_evidence: >
  2025 biopharma M&A re-accelerated (deal value and count up YoY) as the 2026-2028 LOE wall came into the
  planning horizon; by early 2026 YTD deal value (~$106B by June) confirmed a sustained takeout cycle rather
  than isolated large deals. The dated, recurring LOE need is what makes it structural.

