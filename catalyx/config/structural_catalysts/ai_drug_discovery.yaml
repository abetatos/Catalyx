# StructuralCatalyst: AI-Driven Drug Discovery
#
# Calibration anchor (Rule 3): bootstrap 72 — below struct_ai_capex_supercycle (89.9) and
# struct_biopharma_patent_cliff_ma (80): a genuine science inflection but early-cycle (no AI-designed drug
# is FDA-approved yet as of mid-2026) with binary clinical-timing risk. Cross-cutting SECONDARY driver across
# biotech_drug_development, pharma_large_cap, synthetic_biology, genomics_precision_medicine.

id: struct_ai_drug_discovery
type: structural
schema_version: "1.4"
title: "Biotech platform validation (descubrimiento con IA, edicion genica, biomanufactura)"
description: >
  Machine-learning structure prediction and generative design are compressing the design-build-test cycle in
  drug discovery from years to months, and the capital + first clinical readouts now validate it as a durable
  platform shift rather than hype: (1) Capital — Isomorphic Labs raised a $2.1B Series B (May 2026) and released
  a next-generation design engine (IsoDDE, ~50% vs ~23% prior-gen accuracy on hard targets). (2) First clinical
  evidence — Insilico's rentosertib became the first fully AI-designed molecule to show Phase IIa safety +
  efficacy (Nature Medicine). (3) Adoption — every large-cap pharma now runs an AI-discovery partnership, and
  the same tooling accelerates synthetic-biology design and genomics target-ID. It is a SECONDARY, cross-cutting
  driver: it lifts the odds/speed of the pipelines the other biotech structurals depend on. Key caveat: no
  AI-designed drug is FDA-approved yet (mid-2026), so the thesis is validation-stage — a failed pivotal readout
  from a lead AI-designed asset would de-rate the whole theme.

created_at: "2026-07-01T12:00:00Z"
created_by: user
onset_period: "2024-Q3"
onset_evidence: >
  AlphaFold-class structure prediction moved from research tool to industrialized design platform through 2024-2025
  (large pharma partnerships, dedicated AI-discovery raises); by 2026 the first AI-designed molecule posted Phase IIa
  data and Isomorphic's $2.1B raise confirmed institutional capital scale — the shift from tool to platform.

catalyst_type: technology_adoption
catalyst_subtype: ai_drug_discovery
geography: [US, EU, GLOBAL]
thematic_tags: [ai, drug_discovery, alphafold, isomorphic, insilico, biotech, platform]
user_rank: 4
user_notes: >
  No clean UCITS pure-play; expressed through biotech baskets and the large-caps with AI-discovery programs.
  SECONDARY catalyst — link alongside a primary sector driver, not alone. Bootstrap 72 anchored below the
  patent-cliff structural (80). Validation-stage: watch for the first AI-designed-drug pivotal readout.

