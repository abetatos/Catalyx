# StructuralCatalyst: In-Vivo Gene Editing / CRISPR Clinical Validation
#
# Calibration anchor (Rule 3): bootstrap 68 — weaker than struct_ai_capex_supercycle (89.9); a genuine
# science inflection but early-cycle, endogenous (clinical, not macro-flow driven) with binary timing risk.
# Drives genomics_precision_medicine (primary).

id: struct_crispr_gene_editing_validation
type: structural
schema_version: "1.4"
title: "In-vivo gene editing / CRISPR clinical validation — first in-vivo therapy toward approval"
description: >
  Gene editing is crossing from ex-vivo proof-of-concept to in-vivo clinical validation, the inflection that
  turns a science story into a commercial platform: (1) First in-vivo therapy on the approval path — Intellia's
  lonvo-z (in-vivo CRISPR for hereditary angioedema) posted an ~87% attack-rate reduction in Phase 3 and is in
  a rolling BLA submission (completion H2 2026, commercial launch targeted H1 2027) — potentially the world's
  first in-vivo CRISPR therapy. (2) Cost floor — whole-genome sequencing crossed the sub-$100 research threshold,
  scaling the diagnostic base that makes precision-medicine reimbursable. (3) Reimbursement — a pending CMS
  multi-cancer-early-detection (MCED) liquid-biopsy coverage decision would open a large paid market. Primary
  sector: genomics_precision_medicine (editing platforms + sequencing + precision-dx). Key risk: a safety event
  in an in-vivo program, or a negative CMS coverage decision, would set the whole platform back.

created_at: "2026-07-01T12:00:00Z"
created_by: user
onset_period: "2025-Q4"
onset_evidence: >
  Intellia's lonvo-z Phase 3 in-vivo efficacy readout and the start of its rolling BLA (late 2025 / early 2026)
  marked the first in-vivo CRISPR therapy on a regulatory approval path — the transition from ex-vivo edits to
  a scalable in-vivo platform.

