merge_rationale: |
  Validacion de edicion genica y descubrimiento asistido por IA son la misma tesis: una plataforma tecnologica que baja el coste y el riesgo de llevar un farmaco a clinica. Comparten vehiculo (BTEC.L/HEAL.L) y se confirman con el mismo tipo de evidencia (lecturas clinicas de plataforma).
