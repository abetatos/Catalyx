onset_evidence: >
  ECB raised all three key rates in June 2026 (deposit rate 2.25%) and again on 2026-09-10 (2.50%,
  effective 2026-09-16); the Fed pivoted hawkish on 2026-06-17 and hiked on 2026-09-16. FDIC industry NIM
  rose to 3.32% in Q2 2026 from about 3.26% a year earlier (FDIC Quarterly Banking Profile, Aug 2026).

