id: struct_higher_rates_bank_margins
type: structural
schema_version: "1.4"
title: "Higher policy rates and a positive curve restore bank net interest margins"
description: >
  After the 2022-24 cycle, policy rates are rising again in both blocs (ECB deposit rate 2.00% → 2.50%
  across June and September 2026; Fed funds 3.75-4.00% after the 2026-09-16 hike, with 16 of 18 FOMC
  participants expecting another before year-end) and the US curve has re-steepened (10y-2y +44bp on
  2026-10-09, after being inverted until September 2024). For banks the mechanism is asset repricing
  faster than deposit repricing: floating-rate and short-duration loan books reset upward immediately,
  while a sticky deposit base follows with a lag. Evidence that it is working: the FDIC industry net
  interest margin reached 3.32% in Q2 2026 (+6bp YoY); JPMorgan raised 2026 net interest income guidance
  to $106.2B on 2026-10-13 (Q3 NII $27.1B, +13% YoY); 13 of the 30 largest European banks raised
  full-year NII guidance after Q2. This is cyclical, not secular, and it has a known failure mode:
  rising Treasury yields pull deposits toward higher-yielding alternatives, forcing banks to pay up —
  Citi and Wells Fargo guided Q3 margins DOWN (about 2.46% and 2.41%) even as NII grew. European banks
  with fixed-rate books are hurt rather than helped. Modeled as a driver for the two retail-banking
  sectors only; it is a headwind for rate-sensitive sectors (utilities, real estate) but that channel
  is not scored here.

