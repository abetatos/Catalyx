# CATALYX ETF Universe — v2.0
#
# ══════════════════════════════════════════════════════════════════════════════
# REGLA FUNDACIONAL: aqui SOLO entran instrumentos que el usuario puede COMPRAR
# (Revolut, residente fiscal en Espana). Un ETF que no se puede abrir no es un
# vehiculo — es ruido que rompe tickets y encarece el pipeline.
# ══════════════════════════════════════════════════════════════════════════════
#
# POR QUE SE REESCRIBIO (2026-08-27). La v1.1 tenia tres defectos, todos vistos en
# produccion como "no se puede abrir el ticket":
#   1. 66 de 96 entradas eran ETFs US no-UCITS (ITA, XLE, GDX, XBI, COPX, TAN, LIT,
#      ROBO...). Un retail EEA NO puede comprarlos: PRIIPs exige KID y los emisores
#      US no lo publican. No es una limitacion de Revolut, es regulatoria. Eliminados.
#   2. Errores de IDENTIDAD — el ticker no era el fondo que decia el `name`:
#        IQQR.DE  "Xtrackers Robotics"      -> iShares MSCI EASTERN EUROPE Capped
#        LNGA.L   "LNG UCITS ETF $280M"     -> WisdomTree Natural Gas 2x LEVERAGED ($10M)
#        DFEN.DE  "Xtrackers European Def." -> VanEck Defense (global, $7.2B)
#        EUDF.L   "VanEck Defense"          -> WisdomTree Europe Defence
#        NATO.PA  "BNPP Easy Defense"       -> HANetf Future of Defence
#        IQQH.DE  "grid infrastructure"     -> iShares Global CLEAN ENERGY Transition
#      Un thesis escrito contra un `name` equivocado esta mal desde el minuto cero.
#   3. Tickers muertos o inexistentes: NUKE.L (px 0.0, AUM null), WTRD.L, AIPO.DE,
#      XGLD.DE, XSLV.DE, LUXE.PA — ninguno resuelve.
#   Ademas 3 de los 5 ETFs realmente en cartera (4COP.DE, USPY.L, IUHE.AS) NO estaban
#   en el fichero: el universo describia un mercado que no se opera.
#
# COMO SE VERIFICA (obligatorio al anadir una entrada):
#   uv run python -c "import yfinance,json;i=yfinance.Ticker('TICK').info;\
#     print(i.get('longName'),i.get('currency'),i.get('exchange'),i.get('totalAssets'))"
#   Si no resuelve o el nombre no coincide con lo que crees -> NO lo anadas.
#   `name` debe ser el longName REAL devuelto, no el que te gustaria que fuera.
#
# CAMPOS
#   broker_access:  verified = operado de hecho por el usuario (evidencia en data/movements/)
#                   assumed  = UCITS en LSE/XETRA/Euronext/SIX; alta probabilidad en
#                              Revolut ES pero SIN confirmar en la app todavia
#                   (no existe `blocked`: lo bloqueado no se lista, se borra)
#   instrument:     etf = UCITS ETF | etc = Exchange Traded Commodity (nota abajo)
#   recommendation_tier: 1 preferido | 2 alternativa viable | 3 solo monitorizar
#   aum_m_usd:      totalAssets de yfinance al last_verified (null = no expuesto)
#   ter:            null en toda la v2.0 A PROPOSITO — la v1.1 traia TERs asociados a
#                   fondos que resultaron ser otros. Rellenar solo leyendo el KID del
#                   emisor. Ningun modulo de scoring lee este campo.
#   spread_bps:     OPCIONAL — coste round-trip observado, en puntos basicos. Sin valor
#                   se hereda el global de `scoring_weights.rebalance_rules.spread_bps`
#                   (20bps). Existe porque el `b/e %` de la tabla de rebalance salia
#                   IDENTICO (0.20%) en 7 de 8 filas: una constante no discrimina entre
#                   un IUHE.AS liquido y un JEDI.DE fino, y el b/e es exactamente la
#                   pregunta "¿cuanto tiene que batir el destino al origen?".
#                   COMO SE MIDE: en la revision trimestral de AUM/spread que ya manda
#                   CLAUDE.md — anota el numero observado en vez de emitir solo un
#                   warning. >25bps sigue siendo warning de liquidez.
#                   VACIO A PROPOSITO (2026-08-31). Se intento poblar de un `bid`/`ask`
#                   de yfinance y el snapshot NO es usable: SEMI.L devolvio ask < bid
#                   (14.324 < 14.442), y WCLD.L 463bps / GLUX.SW 193bps son cotizaciones
#                   fuera de hora, no spreads de mercado. Un numero inventado en este
#                   campo es PEOR que el default: el b/e dejaria de ser constante y
#                   pareceria informativo siendo ruido. Se rellena con observaciones en
#                   mercado abierto, a mano, en la revision trimestral — mismo estandar
#                   que `name` (longName REAL) y `ter` (solo leyendo el KID).
#
# ETCs (gold_physical, silver_physical, COPA.L): juridicamente son notas cotizadas,
# no fondos UCITS. Suelen estar disponibles, pero es la categoria con mas riesgo de
# no aparecer en Revolut -> marcados `instrument: etc` y priorizados para verificar.
#
# ADVERTENCIA DE ETIQUETADO (grid_infrastructure_utilities): no existe un UCITS de
# infraestructura de red pura accesible. IQQH.DE/INRG.L son CLEAN ENERGY, no grid.
# La posicion abierta usa IQQH.DE — el vehiculo NO expresa limpiamente la tesis de red.
# Ver `note` en la seccion; revisar en el proximo /catalyx-review.
#
# Solo sectores con `investable: true` en sector_taxonomy.yaml aparecen aqui. Al
# retirar el ultimo vehiculo de un sector, ponlo watch-only en la taxonomia.
#
# last_verified global: 2026-08-27 (yfinance longName/currency/exchange/totalAssets)

